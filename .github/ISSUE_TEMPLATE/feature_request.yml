name: Feature request
description: Suggest a capability this project does not have yet
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Additions to `vocab.yaml` (professions, hair, clothing, ancestries) and
        to `names.yaml` do not need an issue first - open a pull request.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that is awkward or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
      description: |
        If it touches the API, sketch the request and response you would want.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Workarounds, other tools, or why the existing options do not fit.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to open a pull request for this
