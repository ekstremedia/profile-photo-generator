# ---------------------------------------------------------------------------
# Name pools for the template (no-LLM) persona generator.
#
# Only used when Ollama is unavailable or PPG_COMPOSER=template. When Ollama is
# running it writes richer, more varied personas and this file is ignored.
#
# These are ordinary, common given names and surnames. They are combined at
# random and are not intended to refer to any real person. Additions and
# corrections from people who know a region better than this file does are
# very welcome - see CONTRIBUTING.md.
# ---------------------------------------------------------------------------
version: 1

# Maps an `ethnicity` vocabulary value to a pool below.
map:
  northern_european: nordic
  southern_european: southern_european
  eastern_european: eastern_european
  west_african: west_african
  east_african: east_african
  north_african: arabic
  middle_eastern: arabic
  afro_caribbean: anglophone
  african_american: anglophone
  south_asian: south_asian
  east_asian: east_asian
  southeast_asian: southeast_asian
  central_asian: central_asian
  latin_american: latin_american
  indigenous_american: anglophone
  pacific_islander: pacific
  mixed_heritage: anglophone

